Port 2001
# Keep PAM account/session checks; password and keyboard-interactive remain disabled.
UsePAM yes
PermitRootLogin prohibit-password
GSSAPIAuthentication no
KerberosAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PasswordAuthentication no
# Use OpenSSH's current secure algorithm defaults (including RSA-SHA2).
# Do not re-enable legacy SHA-1 ssh-rsa or ssh-dss.
